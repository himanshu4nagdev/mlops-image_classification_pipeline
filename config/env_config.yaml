# Active profile — change this single line to switch environments
active_profile: "laptop_mx450"

profiles:
  laptop_mx450:
    device: "cuda"
    batch_size: 8
    eval_batch_size: 16
    num_workers: 2
    max_epochs: 5
    learning_rate: 0.001
    fp16: true                    # mixed precision to save VRAM
    gradient_accumulation_steps: 4 # simulate larger batch
    image_size: 224
    pin_memory: true
    prefetch_factor: 2

  home_server_3gb:
    device: "cuda"
    batch_size: 16
    eval_batch_size: 32
    num_workers: 4
    max_epochs: 10
    learning_rate: 0.001
    fp16: true
    gradient_accumulation_steps: 2
    image_size: 224
    pin_memory: true
    prefetch_factor: 2

  gpu_server_24gb:
    device: "cuda"
    batch_size: 64
    eval_batch_size: 128
    num_workers: 8
    max_epochs: 15
    learning_rate: 0.001
    fp16: false
    gradient_accumulation_steps: 1
    image_size: 224
    pin_memory: true
    prefetch_factor: 4

  cpu_fallback:
    device: "cpu"
    batch_size: 4
    eval_batch_size: 8
    num_workers: 0
    max_epochs: 3
    learning_rate: 0.0005
    fp16: false
    gradient_accumulation_steps: 8
    image_size: 224
    pin_memory: false
    prefetch_factor: null

mlflow:
  tracking_uri: "http://192.168.26.172:5000"
  experiment_name: "image-clf-mobilenetv2"
  registry_model_name: "mobilenetv2-cifar10"
